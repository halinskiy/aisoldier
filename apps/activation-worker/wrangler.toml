name = "corder-activation"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# 2026-06-01: contact-worker observed that getcorder.com lives on
# Porkbun, not Cloudflare, so a Workers route binding cannot resolve
# api.getcorder.com from here. The activation Worker therefore ships
# to the *.workers.dev domain and Paddle's Notifications destination
# points at the workers.dev URL directly. If DNS later moves to
# Cloudflare, swap to:
#   routes = [
#     { pattern = "api.getcorder.com/paddle-webhook", zone_name = "getcorder.com" }
#   ]
workers_dev = true

# Secrets are populated via `wrangler secret put`:
#   PADDLE_WEBHOOK_SECRET  -- from Paddle Dashboard -> Developer Tools ->
#                             Notifications -> destination -> Secret key.
#                             Paddle generates one per destination; do
#                             NOT reuse across destinations.
#   ALLOWED_ORIGIN         -- optional, defaults to "*" if unset. Only
#                             relevant if a browser POSTs here (Paddle
#                             webhooks are server-to-server, so this
#                             stays mostly cosmetic for now).
