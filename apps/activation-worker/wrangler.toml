name = "corder-activation"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# No Node builtins used (verified: zero node:/process/Buffer/require) --
# nodejs_compat removed 2026-06-09.

# 2026-06-01: contact-worker observed that getcorder.com lives on
# Porkbun, not Cloudflare, so a Workers route binding cannot resolve
# api.getcorder.com from here. The activation Worker therefore ships
# to the *.workers.dev domain and Paddle's Notifications destination
# points at the workers.dev URL directly. If DNS later moves to
# Cloudflare, swap to:
#   routes = [
#     { pattern = "api.getcorder.com/paddle-webhook", zone_name = "getcorder.com" }
#   ]
workers_dev = true

# SUPABASE_URL is public (not a secret) so it ships as a var. The Mac
# app + landing already commit it. Override per deploy if forking.
[vars]
SUPABASE_URL = "https://cfsajlsctzxgixjwslni.supabase.co"
# PADDLE_API_BASE = "https://sandbox-api.paddle.com"   # uncomment for sandbox

# Secrets are populated via `wrangler secret put`:
#   PADDLE_WEBHOOK_SECRET  -- Paddle Dashboard -> Developer Tools ->
#                             Notifications -> destination -> Secret key.
#                             One per destination; do NOT reuse.
#   SUPABASE_SERVICE_ROLE  -- Supabase -> Settings -> API -> service_role
#                             key. REQUIRED to grant tiers. Until set, the
#                             Worker verifies + logs events but writes
#                             nothing (safe degradation).
#   PADDLE_API_KEY         -- Paddle Dashboard -> Authentication -> API
#                             keys. Used to resolve the buyer email from
#                             the customer_id. REQUIRED for grants.
