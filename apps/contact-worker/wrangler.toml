name = "corder-contact"
main = "src/index.ts"
compatibility_date = "2026-05-01"
# No Node builtins used (verified: zero node:/process/Buffer/require) --
# nodejs_compat removed 2026-06-09, it only pulled in the polyfill layer
# for nothing.

# 2026-05-28: domain getcorder.com lives on Porkbun, not Cloudflare,
# so we cannot bind a Worker route to api.getcorder.com from here.
# The Worker is reachable at corder-contact.<account>.workers.dev
# instead; the landing reads that URL from
# NEXT_PUBLIC_CONTACT_ENDPOINT in Vercel.
#
# If/when the zone is moved to Cloudflare, uncomment:
# routes = [
#   { pattern = "api.getcorder.com/contact", zone_name = "getcorder.com" }
# ]
workers_dev = true

# Secrets populated via wrangler:
#   wrangler secret put RESEND_API_KEY    -- re_xxx
#   wrangler secret put TO_ADDRESS        -- hello@getcorder.com
#   wrangler secret put FROM_ADDRESS      -- a verified Resend sender (e.g. noreply@getcorder.com)
#   wrangler secret put ALLOWED_ORIGIN    -- https://getcorder.com
